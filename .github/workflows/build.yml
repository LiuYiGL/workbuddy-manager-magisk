name: Build WorkBuddy Manager Android module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'WorkBuddy Manager 版本（不带 v，留空 = 最新 Release）'
        required: false
        default: ''
  schedule:
    # 每周一 03:23 UTC 自动跟随上游最新 Release
    - cron: '23 3 * * 1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Setup QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Cache release / Go modules
        uses: actions/cache@v4
        with:
          path: .cache
          key: wbm-cache-${{ hashFiles('tools/env.sh', 'tools/rootfs.Dockerfile', 'rootfs-overlay/**') }}
          restore-keys: |
            wbm-cache-

      - name: Build module
        env:
          WB_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyManager-module-arm64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
